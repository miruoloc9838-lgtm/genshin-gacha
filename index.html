<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101426">
<title>原神 チーム抽選</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#101426;--panel:#1a2040;--line:#2c3566;--text:#eef0fa;--sub:#9aa3cf;--gold:#e8c170;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h1{font-size:1.25rem;margin:20px 0 14px;letter-spacing:.04em}
nav{display:flex;gap:8px;margin-bottom:16px}
nav button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--sub);font:inherit}
nav button[aria-selected=true]{background:var(--panel);color:var(--gold);border-color:var(--gold)}
button{cursor:pointer;font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.team{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slot{position:relative;min-height:116px;padding:14px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c,var(--line));display:flex;flex-direction:column;justify-content:flex-end}
.slot.empty{color:var(--sub);justify-content:center;align-items:center;border-left-color:var(--line)}
.slot .el{font-size:.85rem;color:var(--c)}
.slot .nm{font-size:1.3rem;font-weight:700;margin-top:2px;word-break:keep-all}
.slot.locked{box-shadow:0 0 0 1px var(--gold) inset}
.lock{position:absolute;top:8px;right:8px;border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 8px;font-size:.8rem;color:var(--sub)}
.lock[aria-pressed=true]{color:#101426;background:var(--gold);border-color:var(--gold)}
.opts{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:16px 0;color:var(--sub);font-size:.9rem}
.opts select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px}
.draw{width:100%;padding:16px;border:0;border-radius:14px;background:var(--gold);color:#101426;font-size:1.15rem;font-weight:700}
.draw:active{transform:scale(.99)}
.msg{min-height:1.4em;margin:10px 0 0;color:#ff9b8a;font-size:.9rem}
.shuffling .slot:not(.locked){animation:pulse .12s infinite alternate}
@keyframes pulse{to{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.shuffling .slot{animation:none}}
.grp{margin:0 0 16px}
.grp h2{font-size:.95rem;margin:0 0 8px;color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:.9rem;color:var(--sub)}
.chip[aria-pressed=true]{color:var(--text);border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,transparent)}
.chip .x{margin-left:6px;color:var(--sub)}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;color:var(--sub);font-size:.9rem}
.bar button,.add button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px}
.add{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.add input,.add select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}
.add input{flex:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1>原神 チーム抽選</h1>
<nav role="tablist">
  <button role="tab" id="t-draw" aria-selected="true">抽選</button>
  <button role="tab" id="t-roster" aria-selected="false">キャラ設定</button>
</nav>

<main id="v-draw">
  <div class="team" id="team"></div>
  <div class="opts">
    <label>人数 <select id="size"><option>1</option><option>2</option><option>3</option><option selected>4</option></select></label>
    <label><input type="checkbox" id="uniq"> 元素を重複させない</label>
  </div>
  <button class="draw" id="go">抽選する</button>
  <p class="msg" id="msg" role="status"></p>
</main>

<main id="v-roster" hidden>
  <div class="bar"><span id="count"></span><button id="all">全て選択</button><button id="none">全て解除</button></div>
  <div id="groups"></div>
  <div class="add">
    <input id="newName" placeholder="追加するキャラ名" maxlength="20">
    <select id="newEl"></select>
    <button id="addBtn">追加</button>
  </div>
</main>

<script>
const EL={pyro:['炎','#e8683c'],hydro:['水','#3d9be9'],anemo:['風','#4fd1b0'],electro:['雷','#a66be0'],dendro:['草','#8cc63f'],cryo:['氷','#7fd3e8'],geo:['岩','#e0b03c']};
const BASE={
pyro:'アンバー 香菱 ベネット クレー ディルック 煙緋 宵宮 胡桃 辛炎 トーマ ディシア リネ アルレッキーノ シュヴルーズ マーヴィカ ガイミン',
hydro:'バーバラ モナ タルタリヤ 行秋 夜蘭 神里綾人 珊瑚宮心海 ヌヴィレット フリーナ ニィロウ キャンディス ムアラニ シグウィン ダリア',
anemo:'ジン ウェンティ 楓原万葉 放浪者 鹿野院平蔵 閑雲 魈 早柚 ファルザン リネット チャスカ イファ 藍硯',
electro:'フィッシュル レザー 北斗 刻晴 雷電将軍 九条裟羅 八重神子 ドリー セノ 久岐忍 リサ クロリンデ オロルン ヴァレサ イアンサ イネファ',
dendro:'ナヒーダ ティナリ コレイ 白朮 カーヴェ ヨォーヨ アルハイゼン エミリエ 綺良々 キィニチ',
cryo:'ガイア ディオナ 七七 重雲 神里綾華 甘雨 ロサリア エウルア 申鶴 アーロイ レイラ ミカ フレミネ リオセスリ シャルロット エスコフィエ シトラリ スカーク',
geo:'ノエル 鍾離 凝光 アルベド ゴロー 荒瀧一斗 雲菫 ナヴィア 千織 シロネン'
};
const KEY='gtl.v1';
let S={custom:[],off:[],size:4,uniq:false};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const base=Object.entries(BASE).flatMap(([e,t])=>t.split(' ').map(n=>({n,e,c:false})));
const all=()=>[...base,...S.custom.map(x=>({...x,c:true}))];
const $=id=>document.getElementById(id);
let team=[];            // [{n,e,locked}]
let busy=false;

function slotHTML(m,i){
  if(!m) return '<div class="slot empty">?</div>';
  const [en,col]=EL[m.e];
  return `<div class="slot ${m.locked?'locked':''}" style="--c:${col}"><button class="lock" data-i="${i}" aria-pressed="${!!m.locked}">${m.locked?'固定中':'固定'}</button><span class="el">${en}</span><span class="nm">${m.n}</span></div>`;
}
function renderTeam(){
  const n=S.size,h=[];
  for(let i=0;i<n;i++)h.push(slotHTML(team[i],i));
  $('team').innerHTML=h.join('');
}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function compute(){
  const pool=all().filter(c=>!S.off.includes(c.n));
  const keep=team.slice(0,S.size).map(m=>m&&m.locked?m:null);
  const used=new Set(keep.filter(Boolean).map(m=>m.n));
  const usedEl=new Set(keep.filter(Boolean).map(m=>m.e));
  let cand=pool.filter(c=>!used.has(c.n));
  const out=[];
  for(let i=0;i<S.size;i++){
    if(keep[i]){out.push(keep[i]);continue}
    if(S.uniq)cand=cand.filter(c=>!usedEl.has(c.e));
    if(!cand.length){out.push(null);continue}
    const c=pick(cand);
    out.push({n:c.n,e:c.e,locked:false});
    cand=cand.filter(x=>x.n!==c.n);
    usedEl.add(c.e);
  }
  return out;
}
function go(){
  if(busy)return;
  $('msg').textContent='';
  const next=compute();
  if(next.some(m=>!m))$('msg').textContent='候補が足りません。キャラ設定で選択数を増やすか、元素の重複設定を見直してください。';
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const finish=()=>{team=next;renderTeam();$('team').classList.remove('shuffling');busy=false};
  if(reduce){finish();return}
  busy=true;$('team').classList.add('shuffling');
  const pool=all();let t=0;
  const iv=setInterval(()=>{
    team=next.map((m,i)=>m&&m.locked?m:pick(pool));
    renderTeam();
    if(++t>8){clearInterval(iv);finish()}
  },70);
}
$('go').onclick=go;
$('team').onclick=e=>{
  const b=e.target.closest('.lock');if(!b||busy)return;
  const i=+b.dataset.i;if(team[i]){team[i].locked=!team[i].locked;renderTeam()}
};
$('size').value=S.size;$('uniq').checked=S.uniq;
$('size').onchange=e=>{S.size=+e.target.value;save();renderTeam()};
$('uniq').onchange=e=>{S.uniq=e.target.checked;save()};

function renderRoster(){
  const list=all();
  $('count').textContent=`選択中 ${list.filter(c=>!S.off.includes(c.n)).length} / ${list.length}`;
  $('groups').innerHTML=Object.keys(EL).map(e=>{
    const chips=list.filter(c=>c.e===e).map(c=>`<button class="chip" data-n="${c.n}" aria-pressed="${!S.off.includes(c.n)}" style="--c:${EL[e][1]}">${c.n}${c.c?'<span class="x" data-del="1" aria-label="削除">×</span>':''}</button>`).join('');
    return `<section class="grp" style="--c:${EL[e][1]}"><h2>${EL[e][0]}</h2><div class="chips">${chips}</div></section>`;
  }).join('');
}
$('groups').onclick=e=>{
  const b=e.target.closest('.chip');if(!b)return;
  const n=b.dataset.n;
  if(e.target.dataset.del){S.custom=S.custom.filter(c=>c.n!==n);S.off=S.off.filter(x=>x!==n)}
  else S.off=S.off.includes(n)?S.off.filter(x=>x!==n):[...S.off,n];
  save();renderRoster();
};
$('all').onclick=()=>{S.off=[];save();renderRoster()};
$('none').onclick=()=>{S.off=all().map(c=>c.n);save();renderRoster()};
$('newEl').innerHTML=Object.entries(EL).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('');
$('addBtn').onclick=()=>{
  const n=$('newName').value.trim();
  if(!n||all().some(c=>c.n===n))return;
  S.custom.push({n,e:$('newEl').value});save();$('newName').value='';renderRoster();
};

function tab(name){
  const d=name==='draw';
  $('v-draw').hidden=!d;$('v-roster').hidden=d;
  $('t-draw').setAttribute('aria-selected',d);$('t-roster').setAttribute('aria-selected',!d);
  if(!d)renderRoster();
}
$('t-draw').onclick=()=>tab('draw');
$('t-roster').onclick=()=>tab('roster');
renderTeam();

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
